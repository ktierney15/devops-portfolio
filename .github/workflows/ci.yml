name: CI
on:
  push: 
    branches: ["main"]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  React-Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Build React App
        run: npm run build

  Version-Check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require VERSION bump
        run: |
          tag=$(.github/scripts/check-version.sh)
          echo "Merging this PR will release $tag" >> $GITHUB_STEP_SUMMARY

  Version-and-Publish:
    needs: React-Build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Sign in to Git
        run: |
          echo -n "machine github.com login ktierney15 password ${{ secrets.TOKEN }}" > ~/.netrc
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global credential.helper 'store --file ~/.git-credentials'

      - name: Read version from VERSION file
        id: version
        run: echo "TAG=$(.github/scripts/check-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Tag new version
        run: |
          git tag ${{ steps.version.outputs.TAG }}
          git push origin ${{ steps.version.outputs.TAG }}
