name: Delete Resources

on:
  workflow_dispatch:

jobs:
  Destroy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_NEW }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_NEW }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.1.9

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_NEW }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_NEW }}
          aws-region: us-east-1

      - name: Initialize Terraform
        run: terraform init
        working-directory: ./IAC

      - name: Destroy Terraform Resources
        run: terraform destroy -auto-approve -var="aws_access_key=${{ secrets.AWS_ACCESS_KEY_ID_NEW }}" -var="aws_secret_key=${{ secrets.AWS_SECRET_ACCESS_KEY_NEW }}" -var="app_name=${{ github.event.repository.name }}" -var="source_path=./build" -var="ver=destroy" -var="route53_zone_id=${{ vars.ROUTE53_ZONE_ID }}" -var="domain_name=${{ vars.DOMAIN_NAME }}"
        working-directory: ./IAC
