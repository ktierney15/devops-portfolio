name: CD 
on:
  workflow_dispatch:
  
jobs:
  Pre-Check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Deploys must run from a release tag (vMAJOR.MINOR.PATCH), never a branch.
      - name: Require a release tag
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::CD must be run from a release tag like v1.2.3 (got $GITHUB_REF). Pick the tag in 'Use workflow from'."
            exit 1
          fi
          echo "Deploying release tag $GITHUB_REF_NAME"

      # The tag should match the VERSION file it was cut from. Older tags
      # predate the VERSION file, so they're allowed through with a warning.
      - name: Check tag matches VERSION
        run: |
          if [[ ! -f VERSION ]]; then
            echo "::warning::No VERSION file at $GITHUB_REF_NAME; skipping tag/VERSION match check."
            exit 0
          fi
          version="v$(tr -d '[:space:]' < VERSION)"
          if [[ "$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION file ($version)."
            exit 1
          fi

  Deploy:
    runs-on: ubuntu-latest
    needs: Pre-Check
    env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_NEW }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_NEW }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Get version
        id: version
        run: echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18' # or 18

      - name: Install Dependencies
        run: npm install

      - name: Build React App
        run: npm run build

      - name: Move Build Output to IAC Folder
        run: |
          mkdir -p ./IAC/build
          mv ./build/* ./IAC/build/
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.1.9
          # Plain terraform binary so `terraform output -raw` can be captured cleanly.
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_NEW }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_NEW }}
          aws-region: us-east-1

      - name: Initialize Terraform
        run: terraform init
        working-directory: ./IAC

      - name: Validate Terraform
        run: terraform validate
        working-directory: ./IAC

      - name: Plan Terraform
        run: terraform plan -var="aws_access_key=${{ secrets.AWS_ACCESS_KEY_ID_NEW }}" -var="aws_secret_key=${{ secrets.AWS_SECRET_ACCESS_KEY_NEW }}" -var="app_name=${{ github.event.repository.name }}" -var="source_path=./build" -var="ver=${{ steps.version.outputs.VERSION }}" -var="route53_zone_id=${{ vars.ROUTE53_ZONE_ID }}" -var="domain_name=${{ vars.DOMAIN_NAME }}" -out=plan.tfplan
        working-directory: ./IAC

      - name: Apply Terraform
        run: terraform apply -auto-approve plan.tfplan
        working-directory: ./IAC

      # CloudFront caches index.html; without this, visitors can get the old
      # index.html pointing at JS bundles that were just deleted from S3.
      - name: Invalidate CloudFront cache
        working-directory: ./IAC
        run: |
          DISTRIBUTION_ID=$(terraform output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
